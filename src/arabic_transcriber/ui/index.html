<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arabic Transcriber</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><div class="brand"><span class="mark" aria-hidden="true">ا</span><div><h1>Arabic Transcriber</h1></div></div><button id="settingsButton" class="quiet" aria-expanded="false">Einstellungen</button></header>
<section id="settings" hidden aria-label="Modelleinstellungen">
<h2>Cohere Transcribe Arabic</h2><p>Einmaliger Download · ca. 4,13 GB</p>
<a href="#" id="access">Modellzugang ↗</a>
<label>Hugging-Face-Token <input id="token" type="password" autocomplete="off" placeholder="hf_…"></label>
<details><summary>Weitere Einstellungen</summary><div class="settings-row">
<label>Verarbeitung <select id="device"><option value="cpu">CPU</option><option value="cuda">NVIDIA-GPU</option><option value="mps">Apple-GPU · experimentell</option></select></label>
<label class="check" title="Nur das bereits heruntergeladene Modell verwenden"><input type="checkbox" id="offline"> Offline</label>
</div></details></section>
<section class="input-card" aria-label="Quelle"><div class="tabs" role="group" aria-label="Eingabequelle"><button id="fileTab" class="selected" aria-pressed="true">Datei</button><button id="youtubeTab" aria-pressed="false">YouTube</button></div><div class="source-row"><button id="choose" class="file-picker"><span aria-hidden="true">＋</span><span id="filename">Audio oder Video auswählen</span></button><label id="urlLabel" hidden class="url-label"><span class="sr-only">YouTube-Link</span><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…"></label><button id="start" class="primary">Transkribieren <span aria-hidden="true">↗</span></button></div></section>
<section id="queueCard" class="queue-card" hidden aria-label="Warteschlange">
<div class="queue-header"><h2>Warteschlange</h2><span id="queueSummary" aria-live="polite"></span><div class="queue-controls"><button id="releaseMemory" class="memory-button" hidden>Speicher freigeben</button><button id="pause" class="pause-button">Pause</button></div></div>
<div id="queueList" class="queue-list"></div><div class="queue-footer"><span id="memoryState"></span><span id="queueState" aria-live="polite"></span></div>
</section>
<div class="status" aria-live="polite"><p id="error" hidden role="alert"></p></div>
<section class="transcript-card"><div class="transcript-toolbar"><div><h2>Transkript <span id="segmentCount"></span></h2><p id="transcriptTitle"></p></div><label class="check" title="Ungefähre Audioabschnittszeiten, keine exakten Wortzeitmarken"><input id="times" type="checkbox"> Zeiten <span class="approx">≈</span></label></div><div id="empty"><div class="empty-glyph" aria-hidden="true">أ</div><h3>Dein Transkript</h3></div><article id="transcript" dir="rtl" lang="ar" aria-label="Arabisches Transkript"></article><footer><label class="check" title="Gilt für Kopieren sowie TXT, Word und PDF"><input id="outputTimes" type="checkbox"> Zeiten in Kopie / Export</label><div class="exports"><button id="copy" disabled>Alles kopieren</button><select id="format" aria-label="Exportformat"><option value="txt">Text · TXT</option><option value="docx">Word · DOCX</option><option value="pdf">PDF</option></select><button id="export" disabled>Exportieren ↓</button></div></footer></section><p class="footnote">Arabisch · lokal <span id="feedback" role="status"></span></p>
</main><script src="app.js"></script></body></html>
