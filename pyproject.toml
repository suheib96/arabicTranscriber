[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-transcriber"
version = "0.2.0"
description = "Local Arabic transcription with Cohere Transcribe"
requires-python = ">=3.11,<3.14"
dependencies = [
  "psutil>=7,<8", "pywebview>=6.0,<7", "numpy>=2,<3", "torch>=2.7,<3",
  "transformers>=5.4,<6", "huggingface-hub>=1,<2", "soundfile>=0.13,<1",
  "librosa>=0.11,<1", "sentencepiece>=0.2,<1", "protobuf>=5", "accelerate>=1,<2",
  "yt-dlp[default]>=2026.3.17", "python-docx>=1.2,<2", "fpdf2>=2.8.3,<3",
  "uharfbuzz>=0.50", "imageio-ffmpeg>=0.6,<1", "pyperclip>=1.9,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "pyinstaller>=6.16", "pypdf>=5"]
[project.scripts]
arabic-transcriber = "arabic_transcriber.app:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/arabic_transcriber"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
