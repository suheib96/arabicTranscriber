name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install chromium
      - run: node scripts/ui_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-${{ matrix.os }}
          path: .scratch/arabic-transcriber/ui-*.png
          include-hidden-files: true
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.22'
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Prepare bundled media and JS tools
        run: uv run python scripts/prepare_tools.py
      - name: Import Apple signing certificate (trusted tags only)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: uv run python scripts/import_apple_certificate.py
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Package unsigned PR/development build
        if: "!startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push'"
        run: uv run pyinstaller --noconfirm ArabicTranscriber.spec
      - name: Package release (optional Developer ID)
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: uv run pyinstaller --noconfirm ArabicTranscriber.spec
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      - name: Notarize macOS (optional, trusted tags only)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        run: uv run python scripts/sign_macos.py
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Verify ad-hoc development signature
        if: runner.os == 'macOS' && (!startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push')
        run: uv run python scripts/sign_macos.py
      - name: Smoke check native macOS bundle
        if: runner.os == 'macOS'
        run: |
          "dist/Arabic Transcriber.app/Contents/MacOS/Arabic Transcriber" --worker-check --smoke-report build/worker-check.json
          "dist/Arabic Transcriber.app/Contents/MacOS/Arabic Transcriber" --self-check --smoke-report build/package-check.json
          "dist/Arabic Transcriber.app/Contents/MacOS/Arabic Transcriber" --smoke --smoke-report build/native-smoke.json
          uv run python scripts/check_smoke.py build/native-smoke.json
      - name: Smoke check Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/Arabic Transcriber/Arabic Transcriber.exe' -ArgumentList '--worker-check', '--smoke-report', 'build/worker-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Worker process check failed' }
          $process = Start-Process -FilePath 'dist/Arabic Transcriber/Arabic Transcriber.exe' -ArgumentList '--self-check', '--smoke-report', 'build/package-check.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Package check failed' }
          $process = Start-Process -FilePath 'dist/Arabic Transcriber/Arabic Transcriber.exe' -ArgumentList '--smoke', '--smoke-report', 'build/native-smoke.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Native smoke failed' }
          uv run python scripts/check_smoke.py build/native-smoke.json
      - name: Sign Windows executable (optional, trusted tags only)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        run: ./scripts/sign_windows.ps1
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Download WebView2 installer from Microsoft and verify Authenticode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature build/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Microsoft installer signature' }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Sign Windows installer (optional, trusted tags only)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        run: ./scripts/sign_windows.ps1
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: uv run python scripts/archive_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-evidence-${{ matrix.os }}
          path: build/*-check.json
      - name: Remove temporary Apple keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/arabic-transcriber-signing.keychain-db" || true
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - name: Create tagged GitHub Release and upload packages/checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "Arabic Transcriber $TAG" release/*.zip release/*.exe release/*.sha256
